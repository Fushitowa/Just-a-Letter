<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf6f2">
  <title>A Little Love Letter</title>
  <link rel="stylesheet" href="assets/index.css">
  <link rel="stylesheet" href="assets/music.css">
</head>
<body>
  <main class="scene">
    <p class="eyebrow">a little something for you</p>
    <h1>You've got a love letter</h1>
    <p class="hint">A small note, sealed with love.</p>

    <a class="envelope-button" href="letter.html" aria-label="Open the love letter">
      <span class="envelope" aria-hidden="true">
        <span class="back"></span>
        <span class="letter"></span>
        <span class="front"></span>
        <span class="flap"></span>
        <span class="sparkle one">♥</span>
        <span class="sparkle two">♥</span>
        <span class="sparkle three">✦</span>
        <span class="sparkle four">✦</span>
        <span class="seal">
          <svg viewBox="0 0 32 32" role="presentation"><path d="M16 27S3 19.3 3 11.2C3 4.6 11 3 16 9c5-6 13-4.4 13 2.2C29 19.3 16 27 16 27Z" fill="#df6576" stroke="#984857" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 10c.7-2.2 2.3-3.1 4.5-3.1" fill="none" stroke="#ffd5d3" stroke-width="1.3" stroke-linecap="round"/></svg>
        </span>
      </span>
    </a>
    <p class="caption" aria-live="polite">Tap the envelope to open it</p>
    <button class="music-control" type="button" aria-label="Play music" aria-pressed="false">
      <span class="music-icon" aria-hidden="true">♪</span>
      <span class="music-label">Play music</span>
    </button>
  </main>
  <audio id="background-song" autoplay loop preload="auto" aria-hidden="true">
    <source src="assets/song/Arctic%20Monkeys%20-%20I%20Wanna%20Be%20Yours.mp3" type="audio/mpeg">
  </audio>
  <script src="assets/music.js"></script>
</body>
</html>
